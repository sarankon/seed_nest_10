# version: '3.4'
name: seed
services:

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: seed_db
      POSTGRES_USER: seed_user
      POSTGRES_PASSWORD: seed_password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - default
    ports:
      - 5432:5432

  adminer:
    image: adminer:5
    restart: always
    networks:
      - default
    ports:
      - 8080:8080

  # pgadmin:
  #   image: elestio/pgadmin:REL-9_4
  #   restart: always
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=admin@seed.com
  #     - PGADMIN_DEFAULT_PASSWORD=admin_seed
  #     - PGADMIN_LISTEN_PORT=8080
  #   networks:
  #     - default
  #   ports:
  #     - "8080:8080"

networks:
  default:
    name: seed-network
    driver: bridge
